name: Claude CLI Bridge CI

on:
  push:
    branches: [main, master]
    paths:
      - 'tools/claude-cli-bridge/**'
      - '.github/workflows/claude-cli-bridge-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'tools/claude-cli-bridge/**'
      - '.github/workflows/claude-cli-bridge-ci.yml'

permissions:
  contents: read

concurrency:
  group: claude-cli-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/claude-cli-bridge
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q
